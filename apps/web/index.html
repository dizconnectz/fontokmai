<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075e57" />
    <script>
      // same rule as src/theme.ts, before the first paint: a saved choice, else the device setting
      try {
        var t = localStorage.getItem('fontokmai.theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta
      name="description"
      content="ฝนตกไหม — ติดตามประกาศอากาศของกรมอุตุนิยมวิทยาบนแผนที่ประเทศไทย พร้อมแหล่งที่มาและเวลาข้อมูล"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ฝนตกไหม · ประกาศอากาศประเทศไทย</title>
  </head>
  <body>
    <div id="root">
      <h1>ฝนตกไหม — ประกาศอากาศประเทศไทย</h1>
      <p>กำลังเปิดแผนที่และรายการประกาศทางการ</p>
      <p>ประกาศกรมอุตุนิยมวิทยา เรดาร์ฝน พยากรณ์ฝน และประวัติน้ำท่วมถนน บนแผนที่ประเทศไทย</p>
      <noscript
        >เปิด JavaScript เพื่อดูแผนที่และข้อมูลประกาศ หรืออ่านประกาศโดยตรงที่
        <a href="https://www.tmd.go.th">กรมอุตุนิยมวิทยา</a></noscript
      >
      <a href="%BASE_URL%sources/">แหล่งข้อมูล</a> · <a href="%BASE_URL%method/">วิธีอ่านข้อมูล</a>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
