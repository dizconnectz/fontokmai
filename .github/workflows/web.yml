name: web
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:licenses
      - run: npm test
      - name: Consumer contract tests
        working-directory: .
        run: node apps/web/node_modules/vitest/vitest.mjs run --config tests/consumer/vitest.config.mts
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Consumer browser regressions
        working-directory: .
        run: node apps/web/node_modules/@playwright/test/cli.js test --config tests/consumer/playwright.config.mjs
