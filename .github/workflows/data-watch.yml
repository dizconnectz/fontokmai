# Watch the published data from outside the VPS, quietly. The report goes to the run's log and summary only: no
# issue, no mention and no failed run, so nothing emails the owner (user 2026-10-01: "ไม่อยากให้มันส่งเมลมา ... คุณเช็ก
# ของคุณเองก็พอ"). Claude reads the runs itself (`gh run list --workflow data-watch.yml`, `gh run view <id> --log`)
# together with the round log on the VPS. Free on a public repository.
name: data-watch
on:
  schedule:
    # 5 minutes after each publish slot (:03, :18, :33, :48); GitHub may start a scheduled run late or skip one
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # a failed scheduled run emails the owner too: what the check finds is in its report, not in the run's result
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Check the live data (report in the log and the summary)
        run: |
          python3 scripts/check_live_data.py --report report.md --status status.txt || echo "problem" > status.txt
          echo "data-watch status: $(cat status.txt)"
          if [ -f report.md ]; then cat report.md; cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
