name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Dependency licenses (no GPL family)
        run: uv run --with pip-licenses pip-licenses --partial-match --fail-on "GPL"
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Regenerate schema, examples and TypeScript
        run: |
          cd pipeline
          uv sync --locked
          uv run fontokmai export-schemas --out ../contracts/v1/schema
          uv run fontokmai contract-examples --out ../contracts/v1/examples --real-fixtures tests/fixtures/tmd_cap --synthetic-fixtures tests/fixtures/tmd_cap_synthetic --road-flood-fixtures tests/fixtures/road_flood --forecast-fixtures tests/fixtures/open_meteo
          cd ..
          bash scripts/gen-ts-types.sh
      - name: Generated files must be committed
        run: git diff --exit-code -- contracts/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fontokmai-pipeline:ci pipeline
      - run: docker run --rm fontokmai-pipeline:ci --help
  repo-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_repo_safety.py
      - run: python3 -m unittest scripts/test_check_live_data.py
